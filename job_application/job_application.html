<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form action="">
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">

            <select name="" id="position">
                <option value="">Select a position</option>
                <option value="Developer" >Developer</option>
                <option value="Designer" >Designer</option>
                <option value="Manager" >Manager</option>
            </select>

            <fieldset class="radio-group">
                <legend>Availability:</legend>
                <input type="radio" value="Full-Time" id="full-time" name="availability">
                <label for="full-time">Full-Time</label>
                <input type="radio" value="Part-Time" id="part-time" name="availability">
                <label for="part-time">Part-Time</label>
            </fieldset>

            <label for="message"> Why do you want this job?</label>
            <textarea name="" id="message" rows="5" placeholder="Describe yourself here..."></textarea>

            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
